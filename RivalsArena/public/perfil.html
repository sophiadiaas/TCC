<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Perfil | Rivals Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="perfil">
    <header id="navbar" class="navbar" aria-busy="true"></header>
    <main>
      <div class="perfil-topo" id="perfil-topo">
        <div class="container">
          <p class="state state-loading">Carregando perfil...</p>
        </div>
      </div>
      <section class="container secao">
        <div class="kpis" id="kpis"></div>
        <h2>Histórico de partidas</h2>
        <br />
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Oponente</th>
                <th>Resultado</th>
                <th>Jogo</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody id="historico"></tbody>
          </table>
        </div>
        <br />
        <h2>Campeonatos</h2>
        <p>Participando e finalizados</p>
        <div class="grid" id="disputados"></div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/perfil.js"></script>
  </body>
</html>
