<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Perfil | Rivals Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="perfil">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header id="navbar" class="navbar" aria-busy="true"></header>
    <main id="conteudo">
      <div class="page-hero">
        <div class="container">
          <h1>Perfil</h1>
          <p>Consulte seu histórico, estatísticas e campeonatos.</p>
        </div>
      </div>
      <div class="perfil-topo" id="perfil-topo">
        <div class="container">
          <p class="state state-loading">Carregando perfil...</p>
        </div>
      </div>
      <section class="container secao">
        <div class="kpis" id="kpis"></div>
        <h2>Histórico de partidas</h2>
        <br />
        <div
          class="tabela-wrap"
          role="region"
          aria-label="Histórico de partidas; tabela rolável horizontalmente"
          tabindex="0"
        >
          <table>
            <caption class="sr-only">
              Histórico de partidas do jogador
            </caption>
            <thead>
              <tr>
                <th scope="col">Oponente</th>
                <th scope="col">Resultado</th>
                <th scope="col">Jogo</th>
                <th scope="col">Data</th>
              </tr>
            </thead>
            <tbody id="historico"></tbody>
          </table>
        </div>
        <br />
        <h2>Campeonatos</h2>
        <p>Participando e finalizados</p>
        <div class="grid" id="disputados"></div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/perfil.js"></script>
  </body>
</html>
