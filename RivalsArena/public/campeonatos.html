<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Campeonatos | Rivals Arena</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="campeonatos">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header id="navbar" class="navbar" aria-busy="true"></header>
    <main id="conteudo">
      <div class="page-hero">
        <div class="container">
          <h1>Campeonatos</h1>
          <p>
            Encontre uma competição, consulte os detalhes e inscreva seu time.
          </p>
        </div>
      </div>
      <section class="container secao">
        <h2 class="sr-only">Filtros e campeonatos disponíveis</h2>
        <div class="filtros grid grid-4">
          <label for="f-jogo">Jogo<select id="f-jogo"></select></label>
          <label for="f-status"
            >Status<select id="f-status">
              <option value="">Todos</option>
              <option value="open">Inscrições abertas</option>
              <option value="running">Em andamento</option>
              <option value="finished">Finalizado</option>
            </select></label
          >
          <label for="f-data"
            >Data (a partir de)<input type="date" id="f-data"
          /></label>
          <label for="f-part"
            >Tamanho do campeonato<select id="f-part">
              <option value="">Qualquer quantidade</option>
              <option value="16">Até 16 times</option>
              <option value="32">Até 32 times</option>
              <option value="64">Até 64 times</option>
            </select></label
          >
        </div>
        <div class="grid" id="lista" aria-live="polite">
          <p class="state state-loading">Carregando campeonatos...</p>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/campeonatos.js"></script>
  </body>
</html>
