<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ranking | Rivals Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="ranking">
    <header id="navbar" class="navbar" aria-busy="true"></header>
    <main>
      <div class="page-hero">
        <div class="container">
          <small>Competitivo</small>
          <h1>Ranking</h1>
          <p>Acompanhe os jogadores com maior pontuação</p>
        </div>
      </div>
      <section class="container secao">
        <div class="filtros grid grid-4">
          <label>Jogos<select id="r-jogo"></select></label>
          <div class="filter-note">
            <span>Temporada</span><strong>Histórico completo</strong>
          </div>
          <label
            >Região<select id="r-regiao">
              <option value="">Todas</option>
              <option>Brasil</option>
              <option>América Latina</option>
            </select></label
          ><label
            >Buscar jogador<input id="r-busca" placeholder="Nome do jogador"
          /></label>
        </div>
        <div class="podio" id="podio" aria-live="polite">
          <p class="state state-loading">Carregando ranking...</p>
        </div>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Posição</th>
                <th>Jogador</th>
                <th>Vitórias</th>
                <th>Derrotas</th>
                <th>Partidas</th>
                <th>Pontuação</th>
              </tr>
            </thead>
            <tbody id="tabela"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/ranking.js"></script>
  </body>
</html>
