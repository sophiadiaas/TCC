<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ranking | Rivals Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700&family=Pixelify+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="ranking">
    <header id="navbar"></header>
    <main>
      <div class="page-hero">
        <div class="container">
          <small>Competitivo</small>
          <h1>Ranking</h1>
          <p>Acompanhe os jogadores com maior pontuação</p>
        </div>
      </div>
      <section class="container secao">
        <div class="filtros grid grid-4">
          <label>Jogos<select id="r-jogo"></select></label
          ><label
            >Temporada<select id="r-temporada">
              <option>Histórico completo</option>
            </select></label
          ><label
            >Região<select id="r-regiao">
              <option value="">Todas</option>
              <option>Brasil</option>
              <option>América Latina</option>
            </select></label
          ><label
            >Buscar jogador<input id="r-busca" placeholder="Nome do jogador"
          /></label>
        </div>
        <div class="podio" id="podio"></div>
        <div class="tabela-wrap">
          <table>
            <thead>
              <tr>
                <th>Posição</th>
                <th>Jogador</th>
                <th>Vitórias</th>
                <th>Derrotas</th>
                <th>Partidas</th>
                <th>Pontuação</th>
              </tr>
            </thead>
            <tbody id="tabela"></tbody>
          </table>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/ranking.js"></script>
  </body>
</html>
