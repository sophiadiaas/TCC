<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Jogos | Rivals Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="jogos">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header id="navbar" class="navbar" aria-busy="true"></header>
    <main id="conteudo">
      <div class="page-hero">
        <div class="container">
          <h1>Jogos</h1>
          <p>Capivarada já está disponível; outros jogos chegam em breve.</p>
        </div>
      </div>
      <section class="container secao" id="catalogo">
        <div class="grid" id="lista-jogos" aria-live="polite">
          <p class="state state-loading">Carregando catálogo...</p>
        </div>
      </section>
      <section id="detalhe" hidden></section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/jogos.js"></script>
  </body>
</html>
