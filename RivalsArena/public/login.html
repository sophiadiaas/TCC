<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | Rivals Arena</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="login">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <main id="conteudo">
      <div class="auth">
        <div class="auth-card">
          <img src="assets/images/logo.png" alt="Rivals Arena" />
          <h1>ENTRAR NA ARENA</h1>
          <form id="form-login">
            <label for="login"
              >E-mail ou nome de usuário<input
                id="login"
                name="login"
                autocomplete="username"
                required
            /></label>
            <label for="senha"
              >Senha<input
                id="senha"
                type="password"
                name="senha"
                autocomplete="current-password"
                required
            /></label>
            <label class="check-row" for="lembrar"
              ><input id="lembrar" type="checkbox" name="lembrar" />Lembrar
              login</label
            >
            <button class="btn btn-bloco" type="submit">Entrar na Arena</button>
            <p
              class="auth-feedback"
              id="auth-feedback"
              role="alert"
              aria-live="polite"
            ></p>
            <div class="links">
              <a href="index.html">Voltar ao início</a
              ><a href="cadastro.html">Criar conta</a>
            </div>
          </form>
        </div>
      </div>
    </main>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
