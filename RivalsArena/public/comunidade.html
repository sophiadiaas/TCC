<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Comunidade | Rivals Arena</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;600;700&family=Pixelify+Sans:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="comunidade">
    <header id="navbar"></header>
    <main>
      <div class="page-hero">
        <div class="container">
          <small>Comunidade</small>
          <h1>Comunidade</h1>
          <p>Compartilhe jogadas, estratégias e habilidades</p>
        </div>
      </div>
      <section class="container secao">
        <div style="text-align: right; margin-bottom: 20px">
          <button class="btn" id="btn-publicar">Criar publicação</button>
        </div>
        <div id="posts"></div>
        <div class="caixa" id="nova" hidden>
          <h2 class="laranja" style="font-weight: 400">Criar publicação</h2>
          <form id="form-post">
            <label
              >Texto<textarea
                id="texto"
                rows="3"
                placeholder="O que você quer compartilhar?"
              ></textarea></label
            ><button class="btn btn-laranja">Publicar</button>
          </form>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/comunidade.js"></script>
  </body>
</html>
