<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Comunidade | Rivals Arena</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsividade.css" />
  </head>
  <body data-pagina="comunidade">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header id="navbar" class="navbar" aria-busy="true"></header>
    <main id="conteudo">
      <div class="page-hero">
        <div class="container">
          <h1>Comunidade</h1>
          <p>
            Compartilhe jogadas, estratégias e novidades com outros jogadores.
          </p>
        </div>
      </div>
      <section class="container secao">
        <div class="section-head actions-row">
          <div>
            <h2>Publicações</h2>
            <p class="section-sub">
              Converse com a comunidade e acompanhe as publicações recentes.
            </p>
          </div>
          <button class="btn" id="btn-publicar" type="button" hidden>
            Ir para o campo de publicação
          </button>
        </div>
        <div class="post-composer caixa" id="nova" hidden>
          <form id="form-post">
            <label for="texto">Sua publicação</label>
            <textarea
              id="texto"
              name="texto"
              rows="3"
              maxlength="1000"
              required
              aria-describedby="contador-texto"
              placeholder="O que você quer compartilhar?"
            ></textarea>
            <div class="composer-actions">
              <span
                class="character-count"
                id="contador-texto"
                aria-live="polite"
                >0 / 1000</span
              >
              <button class="btn btn-laranja" id="submit-post" disabled>
                Publicar
              </button>
            </div>
            <p class="form-feedback" id="post-feedback" role="alert" hidden></p>
          </form>
        </div>
        <div class="caixa guest-prompt" id="publicacao-visitante" hidden>
          <p>Entre na sua conta para publicar e interagir com a comunidade.</p>
          <div class="acoes">
            <a class="btn btn-laranja" href="login.html">Entrar</a>
            <a class="btn btn-outline" href="cadastro.html">Criar conta</a>
          </div>
        </div>
        <div id="posts" aria-live="polite" aria-busy="true">
          <p class="state state-loading">Carregando publicações...</p>
        </div>
      </section>
    </main>
    <footer id="footer"></footer>
    <script src="js/main.js"></script>
    <script src="js/comunidade.js"></script>
  </body>
</html>
